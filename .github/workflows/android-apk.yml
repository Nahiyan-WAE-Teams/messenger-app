name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "package.json"
      - "next.config.mjs"
      - "README.md"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone offline APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Test local dating algorithms
        run: npm test

      - name: Export static offline app
        run: npm run build

      - name: Verify and bundle web app into Android assets
        run: |
          test -f out/index.html
          mkdir -p android/app/src/main/assets/assets
          cp -R out/. android/app/src/main/assets/assets/
          test -f android/app/src/main/assets/assets/index.html
          test -d android/app/src/main/assets/assets/_next

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable standalone APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovely-offline-dating-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
