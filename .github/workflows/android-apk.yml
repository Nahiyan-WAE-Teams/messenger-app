name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: lovely-offline-dating-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build standalone offline APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete queued APK builds
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner, repo, workflow_id: "android-apk.yml", branch: "main", per_page: 100 }
            );
            const obsolete = runs.filter(run =>
              run.id !== context.runId &&
              ["queued", "in_progress"].includes(run.status)
            );
            for (const run of obsolete) {
              core.info(`Cancelling obsolete run ${run.id} (${run.status})`);
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
            }
            core.info(`Cancelled ${obsolete.length} obsolete APK run(s).`);

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Test local dating algorithms
        run: npm test

      - name: Export static offline app
        run: npm run build

      - name: Verify and bundle web app into Android assets
        run: |
          test -f out/index.html
          mkdir -p android/app/src/main/assets/assets
          cp -R out/. android/app/src/main/assets/assets/
          test -f android/app/src/main/assets/assets/index.html
          test -d android/app/src/main/assets/assets/_next

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable standalone APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovely-offline-dating-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
