name: Build Lovely Native Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "README.md"
  workflow_dispatch:

concurrency:
  group: lovely-native-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    name: Test and build native Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Verify native app and intentional internet permission
        run: |
          ! grep -R -n -E 'WebView|androidx\.webkit' android/app/src/main
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/nahiyan/miramessenger/MainActivity.kt
      - name: Run native unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Assemble standalone native APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify APK and permissions
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'android.permission.INTERNET'
      - uses: actions/upload-artifact@v4
        with:
          name: lovely-native-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
